<!doctype html>
<html lang="en" class="h-full antialiased">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%230071e3'/><stop offset='0.5' stop-color='%238b5cf6'/><stop offset='1' stop-color='%2310b981'/></linearGradient></defs><rect width='100' height='100' rx='28' fill='url(%23g)'/><circle cx='50' cy='50' r='24' fill='%23ffffff' opacity='0.92'/><circle cx='50' cy='50' r='12' fill='%230071e3'/><path d='M50 38 Q50 46 42 50 Q50 54 50 62 Q50 54 58 50 Q50 46 50 38 Z' fill='%23ffffff'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fbfbfd" id="meta-theme-color" />
    <title>Flowora — Modern Mindful Productivity</title>
    <!-- Prevent Theme Flash -->
    <script>
      (function() {
        try {
          var mode = localStorage.getItem('flowora_theme_mode') || localStorage.getItem('daylight_theme_mode') || 'system';
          var isDark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            var meta = document.getElementById('meta-theme-color');
            if (meta) meta.setAttribute('content', '#090a0f');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
    <!-- Inter & Plus Jakarta Sans Font for crisp typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="h-full bg-[#fbfbfd] dark:bg-[#090a0f] text-[#1d1d1f] dark:text-[#f5f5f7] font-sans selection:bg-blue-100 dark:selection:bg-blue-900/40 selection:text-[#0071e3] transition-colors duration-200">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
